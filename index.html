<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>農曆除夕倒數計時</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="lantern lantern-left"></div>
  <div class="lantern lantern-right"></div>
  <div class="sparkles"></div>
  <main class="countdown-card">
    <p class="eyebrow">農曆新年 · 團圓夜</p>
    <h1>除夕倒數計時</h1>
    <p id="lunar-today" class="lunar-today">今日農曆</p>
    <section class="time-grid" aria-live="polite">
      <div class="time-block">
        <span id="days" class="time-value">00</span>
        <span class="time-label">天</span>
      </div>
      <div class="time-block">
        <span id="hours" class="time-value">00</span>
        <span class="time-label">時</span>
      </div>
      <div class="time-block">
        <span id="minutes" class="time-value">00</span>
        <span class="time-label">分</span>
      </div>
      <div class="time-block">
        <span id="seconds" class="time-value">00</span>
        <span class="time-label">秒</span>
      </div>
    </section>
    <p id="target-info" class="target-info"></p>
    <p class="note">倒數至除夕夜 23:59 前的最後一刻，一起迎接春節！</p>
  </main>
  <script src="index.js"></script>
</body>
</html>
